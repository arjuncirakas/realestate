# Security headers for the static origin.
#
# This lives in its own file and is `include`d by every location block rather
# than being declared once at server level, because nginx's `add_header` does
# not merge: a location that declares any `add_header` of its own discards
# every header inherited from its parent. Each location here sets Cache-Control,
# so server-level security headers would be silently dropped on every response
# — which is exactly what happened before this file existed.
#
# The API sets its own headers through helmet; these cover the static origin,
# which helmet never sees.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
